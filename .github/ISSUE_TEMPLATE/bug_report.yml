name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: Which app?
      placeholder: e.g. Masarif (expenses)
  - type: input
    id: browser
    attributes:
      label: Browser, device and language
      placeholder: e.g. Chrome 129 on Android, Arabic
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag images here if they help. Please hide personal amounts.
