<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Everyday Solutions</title>
  <meta name="description" content="Small, private, multilingual web apps that solve problems many people face every day.">
  <link rel="icon" href="expenses/icons/icon.svg" type="image/svg+xml">
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f5f7; --surface: #fff; --text: #161b26; --muted: #5d6578; --border: #e3e6ec;
      --accent: #0f766e; --accent-text: #fff; --soft: #e3f4f1;
      --font: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Noto Sans Arabic", Tahoma, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --bg: #0f1218; --surface: #181c24; --text: #e8ebf1; --muted: #9aa3b5; --border: #2a303c;
        --accent: #2dd4bf; --accent-text: #052522; --soft: #123a36;
      }
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0f1218; --surface: #181c24; --text: #e8ebf1; --muted: #9aa3b5; --border: #2a303c;
      --accent: #2dd4bf; --accent-text: #052522; --soft: #123a36;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); line-height: 1.6; }
    .wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }
    header { display: flex; justify-content: flex-end; padding: 16px 0; }
    select { font: inherit; color: inherit; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; }
    .hero { padding: 40px 0 32px; max-width: 720px; }
    .hero h1 { font-size: clamp(2rem, 5vw, 3rem); line-height: 1.15; margin: 0 0 12px; letter-spacing: -0.02em; }
    .hero p { font-size: 1.15rem; color: var(--muted); margin: 0; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; padding-bottom: 48px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 8px; }
    .card .emoji { font-size: 1.8rem; }
    .card h2 { font-size: 1.1rem; margin: 0; }
    .card .problem { color: var(--muted); margin: 0; font-size: 0.95rem; flex: 1; }
    .card a, .card .soon { align-self: flex-start; margin-top: 8px; border-radius: 10px; padding: 8px 14px; font-weight: 600; text-decoration: none; }
    .card a { background: var(--accent); color: var(--accent-text); }
    .card .soon { background: var(--soft); color: var(--text); font-weight: 500; }
    .card.live { border-color: var(--accent); }
    .values { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; padding-bottom: 48px; }
    .values div { border-top: 2px solid var(--accent); padding-top: 12px; }
    .values h3 { margin: 0 0 4px; font-size: 1rem; }
    .values p { margin: 0; color: var(--muted); font-size: 0.95rem; }
    footer { color: var(--muted); font-size: 0.9rem; padding: 24px 0 40px; border-top: 1px solid var(--border); }
    footer a { color: var(--accent); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <select id="lang" aria-label="Language"></select>
    </header>

    <section class="hero">
      <h1 data-t="title"></h1>
      <p data-t="subtitle"></p>
    </section>

    <section class="grid">
      <article class="card live">
        <span class="emoji" aria-hidden="true">💸</span>
        <h2 data-t="expenses.name"></h2>
        <p class="problem" data-t="expenses.problem"></p>
        <a href="expenses/" data-t="open"></a>
      </article>
      <article class="card">
        <span class="emoji" aria-hidden="true">⏱️</span>
        <h2 data-t="focus.name"></h2>
        <p class="problem" data-t="focus.problem"></p>
        <span class="soon" data-t="soon"></span>
      </article>
      <article class="card">
        <span class="emoji" aria-hidden="true">💊</span>
        <h2 data-t="meds.name"></h2>
        <p class="problem" data-t="meds.problem"></p>
        <span class="soon" data-t="soon"></span>
      </article>
      <article class="card">
        <span class="emoji" aria-hidden="true">🧾</span>
        <h2 data-t="split.name"></h2>
        <p class="problem" data-t="split.problem"></p>
        <span class="soon" data-t="soon"></span>
      </article>
    </section>

    <section class="values">
      <div><h3 data-t="v1.title"></h3><p data-t="v1.body"></p></div>
      <div><h3 data-t="v2.title"></h3><p data-t="v2.body"></p></div>
      <div><h3 data-t="v3.title"></h3><p data-t="v3.body"></p></div>
    </section>

    <footer>
      <a href="https://github.com/Zodiachz/new-project-" rel="noopener">GitHub</a> · MIT License
    </footer>
  </div>

          'expenses.name': 'Masarif — harcama takibi', 'expenses.problem': 'Maaş ay bitmeden tükeniyor ve nereye gittiğini bilmiyorsunuz.',

      };
      var KEY = 'everyday.lang';
      var select = document.getElementById('lang');
      Object.keys(T).forEach(function (code) {
        var o = document.createElement('option');
        o.value = code;
        o.textContent = T[code].name;
        select.appendChild(o);
      });
      function detect() {
        try { var saved = localStorage.getItem(KEY); if (saved && T[saved]) return saved; } catch (e) {}
        var prefs = navigator.languages || [navigator.language];
        for (var i = 0; i < prefs.length; i++) { var base = String(prefs[i]).toLowerCase().split('-')[0]; if (T[base]) return base; }
        return 'en';
      }
      function apply(code) {
        var d = T[code];
        document.documentElement.lang = code;
        document.documentElement.dir = code === 'ar' ? 'rtl' : 'ltr';
        document.title = d.title;
        select.value = code;
        document.querySelectorAll('[data-t]').forEach(function (el) { el.textContent = d[el.dataset.t] || T.en[el.dataset.t]; });
      }
      select.addEventListener('change', function () {
        try { localStorage.setItem(KEY, select.value); } catch (e) {}
        apply(select.value);
      });
      apply(detect());
    })();
  </script>
</body>
</html>
