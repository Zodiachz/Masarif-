<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Masarif — Personal expense tracker</title>
  <meta name="description" content="Track income, expenses and subscriptions, see where your money goes and get saving tips. Private, offline, multilingual.">
  <meta name="theme-color" content="#0f766e">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try {
      var saved = JSON.parse(localStorage.getItem('masarif.v2') || '{}');
      if (saved.settings && saved.settings.theme && saved.settings.theme !== 'system') document.documentElement.dataset.theme = saved.settings.theme;
    } catch (e) {}
  </script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M5 7h14M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z"/></g></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 20h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15V4m0 0L8 8m4-4l4 4M5 20h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </svg>

  <header class="top">
    <div class="brand">
      <img src="icons/icon.svg" alt="" width="40" height="40">
      <div>
        <h1 data-i18n="app.name">Masarif</h1>
        <p data-i18n="app.tagline">Know where your money goes</p>
      </div>
    </div>
    <div class="top-actions">
      <label class="lang-picker">
        <svg class="icon" aria-hidden="true"><use href="#i-globe"/></svg>
        <select id="lang-quick" data-i18n-aria-label="settings.language"></select>
      </label>
      <button type="button" id="install" class="ghost" hidden data-i18n="nav.install">Install app</button>
    </div>
  </header>

  <main>
    <nav class="month-nav" data-i18n-aria-label="nav.month">
      <button type="button" id="prev-month" class="icon-btn" data-i18n-aria-label="nav.prevMonth"><svg class="icon flip" aria-hidden="true"><use href="#i-chevron"/></svg></button>
      <h2 id="month-label" aria-live="polite"></h2>
      <button type="button" id="next-month" class="icon-btn" data-i18n-aria-label="nav.nextMonth"><svg class="icon flip next" aria-hidden="true"><use href="#i-chevron"/></svg></button>
      <button type="button" id="this-month" class="ghost small" data-i18n="nav.today">This month</button>
    </nav>

    <section id="welcome" class="card welcome" hidden>
      <div>
        <h2 data-i18n="welcome.title">Welcome!</h2>
        <p data-i18n="welcome.body"></p>
      </div>
      <button type="button" class="primary" data-action="sample" data-i18n="data.sample">Load sample data</button>
    </section>

    <section class="stats">
      <div class="stat"><span data-i18n="stats.income">Income</span><strong id="stat-income"></strong></div>
      <div class="stat"><span data-i18n="stats.expense">Expenses</span><strong id="stat-expense"></strong></div>
      <div class="stat"><span data-i18n="stats.balance">Balance</span><strong id="stat-balance"></strong></div>
      <div class="stat"><span data-i18n="stats.savingsRate">Savings rate</span><strong id="stat-rate"></strong></div>
    </section>

    <div id="budget-bar" class="budget" hidden>
      <div class="budget-label"><span data-i18n="budget.title">Monthly budget</span><span id="budget-text"></span></div>
      <div class="track"><div class="fill" id="budget-fill"></div></div>
    </div>

    <div class="grid">
      <section class="card" id="tx-card">
        <h2 id="tx-title" data-i18n="tx.addTitle">Add a transaction</h2>
        <form id="tx-form" class="form" novalidate>
          <div class="seg" role="radiogroup">
            <label><input type="radio" name="type" value="expense" checked><span data-i18n="tx.expense">Expense</span></label>
            <label><input type="radio" name="type" value="income"><span data-i18n="tx.income">Income</span></label>
          </div>
          <label><span data-i18n="tx.amount">Amount</span><input type="number" name="amount" min="0.01" step="0.01" inputmode="decimal" required></label>
          <label><span data-i18n="tx.category">Category</span><select name="category"></select></label>
          <label><span data-i18n="tx.date">Date</span><input type="date" name="date" required></label>
          <label class="wide"><span data-i18n="tx.note">Note</span><input type="text" name="note" maxlength="120" data-i18n-placeholder="tx.notePlaceholder"></label>
          <div class="wide row-actions">
            <button type="submit" class="primary" id="tx-submit" data-i18n="tx.add">Add</button>
            <button type="button" id="tx-cancel" hidden data-i18n="tx.cancel">Cancel</button>
          </div>
        </form>
      </section>

      <section class="card">
        <h2 data-i18n="trend.title">Last 6 months</h2>
        <div id="trend" class="trend"></div>
      </section>

      <section class="card">
        <h2 data-i18n="breakdown.title">Where did the money go?</h2>
        <ul id="breakdown" class="breakdown"></ul>
        <p id="breakdown-empty" class="empty" data-i18n="breakdown.empty"></p>
      </section>

      <section class="card">
        <h2 data-i18n="tips.title">Saving tips</h2>
        <ul id="tips" class="tips"></ul>
        <p id="tips-empty" class="empty" data-i18n="tips.empty"></p>
      </section>

      <section class="card span-2">
        <div class="card-head">
          <h2 data-i18n="list.title">Transactions</h2>
          <span id="list-count" class="muted"></span>
        </div>
        <div class="filters">
          <input type="search" id="f-query" data-i18n-placeholder="list.search" data-i18n-aria-label="list.search">
          <select id="f-type" data-i18n-aria-label="csv.type">
            <option value="all" data-i18n="list.allTypes"></option>
            <option value="expense" data-i18n="tx.expense"></option>
            <option value="income" data-i18n="tx.income"></option>
          </select>
          <select id="f-category" data-i18n-aria-label="tx.category"></select>
        </div>
        <ul id="tx-list" class="tx-list"></ul>
        <p id="tx-empty" class="empty"></p>
      </section>

      <section class="card">
        <h2 data-i18n="subs.title">Subscriptions</h2>
        <p class="hint" data-i18n="subs.hint"></p>
        <form id="sub-form" class="form" novalidate>
          <label class="wide"><span data-i18n="subs.name">Name</span><input type="text" name="subname" maxlength="60" required></label>
          <label><span data-i18n="subs.amount">Monthly amount</span><input type="number" name="amount" min="0.01" step="0.01" inputmode="decimal" required></label>
          <label><span data-i18n="subs.day">Billing day</span><input type="number" name="day" min="1" max="31" value="1" required></label>
          <div class="wide"><button type="submit" class="primary" data-i18n="subs.add">Add subscription</button></div>
        </form>
        <ul id="sub-list" class="tx-list"></ul>
        <p id="sub-total" class="sub-total"></p>
      </section>

      <section class="card">
        <h2 data-i18n="settings.title">Settings &amp; data</h2>
        <form id="settings-form" class="form" novalidate>
          <label><span data-i18n="settings.language">Language</span><select name="language"></select></label>
          <label><span data-i18n="settings.currency">Currency</span><select name="currency"></select></label>
          <label><span data-i18n="settings.budget">Monthly budget</span><input type="number" name="budget" min="0" step="1" inputmode="decimal" data-i18n-placeholder="settings.budgetPlaceholder"></label>
          <label><span data-i18n="settings.theme">Theme</span>
            <select name="theme">
              <option value="system" data-i18n="theme.system"></option>
              <option value="light" data-i18n="theme.light"></option>
              <option value="dark" data-i18n="theme.dark"></option>
            </select>
          </label>
        </form>
        <div class="actions">
          <button type="button" id="export-csv"><svg class="icon" aria-hidden="true"><use href="#i-download"/></svg><span data-i18n="data.exportCsv"></span></button>
          <button type="button" id="export-json"><svg class="icon" aria-hidden="true"><use href="#i-download"/></svg><span data-i18n="data.backup"></span></button>
          <label class="button"><svg class="icon" aria-hidden="true"><use href="#i-upload"/></svg><span data-i18n="data.restore"></span><input type="file" id="import-json" accept="application/json,.json" hidden></label>
          <button type="button" data-action="sample" data-i18n="data.sample"></button>
          <button type="button" id="clear-all" class="danger" data-i18n="data.clear"></button>
        </div>
        <p class="hint" data-i18n="data.privacy"></p>
      </section>
    </div>
  </main>

  <footer class="footer">
    <span data-i18n="app.name">Masarif</span> · <a href="https://github.com/Zodiachz/new-project-" rel="noopener">GitHub</a> · MIT
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite">
    <span id="toast-text"></span>
    <button type="button" id="toast-action" hidden></button>
  </div>

  <script src="locales/en.js"></script>
  <script src="locales/ar.js"></script>
  <script src="locales/es.js"></script>
  <script src="locales/fr.js"></script>
  <script src="locales/de.js"></script>
  <script src="locales/it.js"></script>
  <script src="locales/pt.js"></script>
  <script src="locales/tr.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/logic.js"></script>
  <script src="js/chart.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
